# FeedWatch API 反向代理 + 对外落地页
# 改动记录：
#   2026-10-15 加静态落地页 —— 用 exact match 精确匹配 / 和 /index.html，
#   不使用 location /，避免把 API 路由吞掉。
server {
    server_name api.tiici.com;

    # ---- 落地页（仅根路径，exact match）----
    location = / {
        root /var/www/feedwatch;
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=300";
    }
    location = /index.html {
        root /var/www/feedwatch;
        add_header Cache-Control "public, max-age=300";
    }

    # ---- ACME HTTP-01 挑战必须走明文 80 ----
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP Streamable HTTP 需要 WebSocket 升级
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 长连接：抓取耗时 + 推送
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 15s;

        # SSE（如果后续加流式响应）
        proxy_buffering off;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.tiici.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.tiici.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.tiici.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name api.tiici.com;
    return 404; # managed by Certbot
}
